# 通用配置（最低优先级）
server:
  undertow:
    threads:
      worker: 64

spring:
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted_at

logging:
  level:
    root: info
    com.heyi: debug
