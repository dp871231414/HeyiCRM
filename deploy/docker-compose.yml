services:
  db:
    image: postgres:15-alpine
    container_name: fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_pwd}
      TZ: Asia/Shanghai
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet_dashboard}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fleet]

  api:
    build:
      context: ../backend
    container_name: fleet-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: 合一重卡生态经营看板
      ENV: ${ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet_pwd}@db:5432/${POSTGRES_DB:-fleet_dashboard}
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32+char-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ''
      IMPORT_MAX_MB: 5
      IMPORT_MAX_ROWS: 2000
      SEED_PASSWORD: ${SEED_PASSWORD:-123456}
      AUTO_SEED: ${AUTO_SEED:-1}
      TZ: Asia/Shanghai
    # 首次启动：迁移 → （可选）种子数据 → 启动服务
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$${AUTO_SEED:-1}\" = \"1\" ]; then python -m app.seed; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks: [fleet]

  web:
    build:
      context: ../frontend
    container_name: fleet-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    networks: [fleet]

volumes:
  fleet_pgdata:

networks:
  fleet:
    driver: bridge
